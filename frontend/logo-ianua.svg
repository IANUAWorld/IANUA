<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- IANUA Logo — Le I-Porte -->

  <!-- Left pillar -->
  <rect x="40" y="20" width="18" height="180" rx="2" fill="#C9A84C"/>

  <!-- Right pillar -->
  <rect x="142" y="20" width="18" height="180" rx="2" fill="#C9A84C"/>

  <!-- Top linteau (arch) -->
  <path d="M40 20 L40 12 Q100 -12 160 12 L160 20 L142 20 Q100 2 58 20 Z" fill="#C9A84C"/>

  <!-- Threshold line — the seuil -->
  <rect x="58" y="140" width="84" height="2.5" rx="1" fill="#C9A84C" opacity="0.6"/>

  <!-- Subtle light glow through the door -->
  <rect x="62" y="28" width="76" height="108" rx="1" fill="#C9A84C" opacity="0.04"/>

  <!-- IANUA text -->
  <text x="100" y="228" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="22" font-weight="600" letter-spacing="12" fill="#C9A84C">IANUA</text>
</svg>