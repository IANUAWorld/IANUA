<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IANUA — Modération</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;900&family=Source+Sans+3:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --gold-dim: rgba(201,168,76,0.15);
      --cyan: #2E9CCA;
      --cyan-dim: rgba(46,156,202,0.15);
      --green: #2ECA8C;
      --red: #CA2E2E;
      --orange: #CA8C2E;
      --dark: #0D0D1A;
      --dark2: #13131F;
      --dark3: #1A1A2E;
      --grey: #8A8A9A;
      --light: #E8E8F0;
      --white: #F5F5FA;
    }
    body {
      background: var(--dark);
      color: var(--light);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── LOGIN ──────────────────── */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .login-overlay.hidden { display: none; }
    .login-box {
      text-align: center;
      max-width: 360px;
      width: 100%;
      padding: 3rem 2rem;
      border: 1px solid rgba(201,168,76,0.2);
      background: var(--dark2);
    }
    .login-logo {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    .login-subtitle {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 2.5rem;
    }
    .login-input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--white);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.85rem;
      outline: none;
      margin-bottom: 0.8rem;
      transition: border-color 0.3s;
    }
    .login-input:focus { border-color: var(--gold); }
    .login-input::placeholder { color: var(--grey); }
    .login-btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--gold);
      color: var(--dark);
      border: none;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s;
    }
    .login-btn:hover { background: var(--gold-light); }
    .login-error {
      color: var(--red);
      font-size: 0.8rem;
      margin-top: 1rem;
      min-height: 1.2rem;
    }

    /* ── HEADER ─────────────────── */
    .admin-header {
      padding: 1.2rem 2rem;
      border-bottom: 1px solid rgba(201,168,76,0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(13,13,26,0.95);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .admin-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.1em;
    }
    .admin-stats {
      display: flex;
      gap: 1.5rem;
      font-size: 0.75rem;
      color: var(--grey);
    }
    .stat-num { color: var(--gold); font-weight: 600; }
    .logout-btn {
      padding: 0.4rem 1rem;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--grey);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    /* ── TABS ───────────────────── */
    .tabs {
      display: flex;
      gap: 0;
      padding: 0 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: var(--dark2);
      overflow-x: auto;
    }
    .tab {
      padding: 1rem 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--grey);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .tab:hover { color: var(--light); }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .tab .badge {
      display: inline-block;
      margin-left: 0.5rem;
      padding: 0.1rem 0.5rem;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 600;
    }
    .badge-pending { background: rgba(201,168,76,0.2); color: var(--gold); }
    .badge-approved { background: rgba(46,202,140,0.2); color: var(--green); }
    .badge-rejected { background: rgba(202,46,46,0.2); color: var(--red); }
    .badge-cyan { background: var(--cyan-dim); color: var(--cyan); }

    /* ── CONTENT ────────────────── */
    .content { padding: 2rem; max-width: 1100px; margin: 0 auto; }

    .principle-group {
      margin-bottom: 2.5rem;
    }
    .principle-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .principle-badge {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--gold);
      min-width: 3rem;
    }
    .principle-badge.cyan { color: var(--cyan); }
    .principle-badge.green { color: var(--green); }
    .principle-name {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--white);
    }
    .principle-count {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--grey);
    }

    .comment-card {
      padding: 1.2rem 1.5rem;
      margin-bottom: 0.8rem;
      background: var(--dark2);
      border-left: 3px solid rgba(201,168,76,0.3);
      transition: all 0.3s;
    }
    .comment-card:hover { border-left-color: var(--gold); }
    .comment-card.status-approved { border-left-color: var(--green); }
    .comment-card.status-rejected { border-left-color: var(--red); opacity: 0.6; }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }
    .card-author {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      color: var(--white);
    }
    .card-country { font-size: 0.75rem; color: var(--grey); }
    .card-lang {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      padding: 0.1rem 0.4rem;
      border: 1px solid rgba(201,168,76,0.25);
      color: var(--gold);
    }
    .card-date {
      font-size: 0.7rem;
      color: var(--grey);
      margin-left: auto;
    }
    .card-content {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: var(--light);
      line-height: 1.7;
      font-style: italic;
      margin-bottom: 1rem;
    }
    .card-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 0.4rem 1.2rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Source Sans 3', sans-serif;
    }
    .btn-approve {
      background: rgba(46,202,140,0.15);
      color: var(--green);
      border: 1px solid rgba(46,202,140,0.3);
    }
    .btn-approve:hover { background: rgba(46,202,140,0.3); }
    .btn-reject {
      background: rgba(202,46,46,0.1);
      color: var(--red);
      border: 1px solid rgba(202,46,46,0.2);
    }
    .btn-reject:hover { background: rgba(202,46,46,0.25); }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--grey);
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
    }

    /* ── SUBSCRIBERS TAB ────────── */
    .subscribers-table {
      width: 100%;
      border-collapse: collapse;
    }
    .subscribers-table th {
      text-align: left;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      padding: 0.8rem 1rem;
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }
    .subscribers-table td {
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      color: var(--light);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    /* ── ARTICLE BADGE + TOOLTIP ── */
    .card-article {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      position: relative;
      cursor: default;
    }
    .card-article-num {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      font-weight: 900;
      padding: 0.15rem 0.5rem;
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--gold);
    }
    .card-article-num.cyan { color: var(--cyan); border-color: rgba(46,156,202,0.3); }
    .card-article-num.green { color: var(--green); border-color: rgba(46,202,140,0.3); }
    .card-article-title {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--light);
      border-bottom: 1px dotted var(--grey);
    }
    .card-article-title:hover { color: var(--gold); }

    .article-tooltip {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 340px;
      padding: 1rem 1.2rem;
      background: var(--dark3);
      border: 1px solid rgba(201,168,76,0.25);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 100;
    }
    .card-article:hover .article-tooltip { display: block; }
    .tooltip-header {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 0.3rem;
    }
    .tooltip-subtitle {
      font-size: 0.72rem;
      color: var(--grey);
      font-style: italic;
      margin-bottom: 0.6rem;
    }
    .tooltip-desc {
      font-size: 0.78rem;
      color: var(--light);
      line-height: 1.6;
    }

    /* ── AMENDMENT ADMIN CARDS ──── */
    .amendment-admin-card {
      padding: 1.2rem 1.5rem;
      margin-bottom: 0.8rem;
      background: var(--dark2);
      border-left: 3px solid rgba(201,168,76,0.3);
      transition: all 0.3s;
    }
    .amendment-admin-card:hover { border-left-color: var(--gold); }
    .amendment-admin-card.status-deliberation { border-left-color: var(--cyan); }
    .amendment-admin-card.status-ratified { border-left-color: var(--green); }
    .amendment-admin-card.status-rejected { border-left-color: var(--red); opacity: 0.7; }
    .amendment-admin-card.status-proposed { border-left-color: var(--orange); }
    .amendment-admin-card.status-deleted { border-left-color: var(--grey); opacity: 0.5; }
    .amendment-admin-card.status-expired { border-left-color: var(--grey); opacity: 0.6; }
    .amendment-admin-card.status-withdrawn { border-left-color: var(--grey); opacity: 0.6; }

    .amendment-code {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 900;
      color: var(--gold);
    }
    .amendment-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      color: var(--light);
      line-height: 1.6;
      margin: 0.4rem 0 0.8rem;
    }
    .amendment-meta {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
      font-size: 0.75rem;
      color: var(--grey);
    }
    .vote-counts {
      font-size: 0.75rem;
      color: var(--grey);
      margin-bottom: 0.8rem;
    }
    .vote-counts span { margin-right: 1rem; }
    .vote-for { color: var(--green); }
    .vote-against { color: var(--red); }
    .vote-abstain { color: var(--grey); }

    /* ── STATUS BADGES ─────────── */
    .status-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.15rem 0.6rem;
      border-radius: 3px;
    }
    .status-badge.deliberation { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(46,156,202,0.25); }
    .status-badge.ratified { background: rgba(46,202,140,0.1); color: var(--green); border: 1px solid rgba(46,202,140,0.25); }
    .status-badge.rejected { background: rgba(202,46,46,0.1); color: var(--red); border: 1px solid rgba(202,46,46,0.25); }
    .status-badge.proposed { background: rgba(202,140,46,0.1); color: var(--orange); border: 1px solid rgba(202,140,46,0.25); }
    .status-badge.expired,
    .status-badge.withdrawn,
    .status-badge.deleted { background: rgba(138,138,154,0.1); color: var(--grey); border: 1px solid rgba(138,138,154,0.25); }

    /* ── DANGER + CYAN BUTTONS ─── */
    .btn-danger {
      background: rgba(202,46,46,0.15);
      color: var(--red);
      border: 1px solid rgba(202,46,46,0.3);
    }
    .btn-danger:hover { background: rgba(202,46,46,0.3); }
    .btn-cyan {
      background: var(--cyan-dim);
      color: var(--cyan);
      border: 1px solid rgba(46,156,202,0.3);
    }
    .btn-cyan:hover { background: rgba(46,156,202,0.3); }
    .btn-gold {
      background: var(--gold-dim);
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.3);
    }
    .btn-gold:hover { background: rgba(201,168,76,0.3); }

    /* ── AUDIT FORM ────────────── */
    .audit-form {
      background: var(--dark2);
      border: 1px solid rgba(46,156,202,0.15);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .audit-form h3 {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--cyan);
      margin-bottom: 1rem;
    }
    .audit-form label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 0.4rem;
      margin-top: 1rem;
    }
    .audit-form label:first-of-type { margin-top: 0; }
    .audit-form select,
    .audit-form textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--white);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .audit-form select:focus,
    .audit-form textarea:focus { border-color: var(--cyan); }
    .audit-form textarea { min-height: 100px; resize: vertical; }
    .audit-checkboxes {
      display: flex;
      gap: 1.5rem;
      margin-top: 0.4rem;
    }
    .audit-checkboxes label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.85rem;
      color: var(--light);
      margin-top: 0;
      cursor: pointer;
    }
    .audit-checkboxes input[type="checkbox"] {
      accent-color: var(--cyan);
    }
    .audit-checkboxes .disabled-model {
      color: var(--grey);
      font-style: italic;
    }
    .audit-form .audit-submit {
      margin-top: 1.2rem;
    }
    .audit-results {
      margin-top: 1rem;
      font-size: 0.85rem;
    }
    .audit-results .result-ok { color: var(--green); }
    .audit-results .result-err { color: var(--red); }

    /* ── AUDIT RESPONSE CARD ───── */
    .audit-response-card {
      padding: 1.2rem 1.5rem;
      margin-bottom: 0.8rem;
      background: var(--dark2);
      border-left: 3px solid rgba(46,156,202,0.4);
      transition: all 0.3s;
    }
    .audit-response-card:hover { border-left-color: var(--cyan); }
    .audit-response-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .audit-model-name {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--cyan);
    }
    .audit-model-version {
      font-size: 0.7rem;
      color: var(--grey);
    }
    .audit-response-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      color: var(--light);
      line-height: 1.7;
      margin-bottom: 0.8rem;
      white-space: pre-wrap;
    }
    .voir-plus {
      color: var(--cyan);
      cursor: pointer;
      font-size: 0.8rem;
      border: none;
      background: none;
      font-family: 'Source Sans 3', sans-serif;
    }
    .voir-plus:hover { text-decoration: underline; }

    /* ── SECTION TITLES ─────────── */
    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 1.2rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid rgba(201,168,76,0.15);
    }
    .section-title.cyan { color: var(--cyan); border-bottom-color: rgba(46,156,202,0.15); }

    /* ── TRANSPARENCY TABLE ────── */
    .transparency-table {
      width: 100%;
      border-collapse: collapse;
    }
    .transparency-table th {
      text-align: left;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      padding: 0.8rem 0.8rem;
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }
    .transparency-table td {
      padding: 0.6rem 0.8rem;
      font-size: 0.8rem;
      color: var(--light);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: top;
    }
    .transparency-table .action-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.1rem 0.5rem;
      border-radius: 3px;
    }
    .action-label.deleted { background: rgba(202,46,46,0.15); color: var(--red); }
    .action-label.tier_requalified { background: rgba(201,168,76,0.15); color: var(--gold); }
    .action-label.reports_dismissed { background: rgba(46,202,140,0.15); color: var(--green); }
    .action-label.tier_challenge_divergent { background: rgba(202,140,46,0.15); color: var(--orange); }
    .action-label.audit_published { background: var(--cyan-dim); color: var(--cyan); }
    .action-label.audit_rejected { background: rgba(202,46,46,0.1); color: var(--red); }

    /* ── TIER SELECT ───────────── */
    .tier-select-group {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      margin-top: 0.5rem;
    }
    .tier-select-group select {
      padding: 0.3rem 0.6rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--white);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.8rem;
      outline: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <div class="login-logo">IANUA</div>
      <div class="login-subtitle">Espace modération</div>
      <input type="text" class="login-input" id="loginUser" placeholder="Identifiant" autocomplete="off" />
      <input type="password" class="login-input" id="loginPass" placeholder="Clé admin" autocomplete="off" />
      <button class="login-btn" onclick="doLogin()">Connexion</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="hidden">
    <div class="admin-header">
      <div class="admin-title">IANUA — Modération</div>
      <div class="admin-stats">
        <span>En attente : <span class="stat-num" id="statPending">0</span></span>
        <span>Signataires : <span class="stat-num" id="statSignataires">0</span></span>
        <span>Amendements : <span class="stat-num" id="statDeliberation">0</span></span>
      </div>
      <button class="logout-btn" onclick="doLogout()">Déconnexion</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="pending" onclick="switchTab('pending')">
        En attente <span class="badge badge-pending" id="badgePending">0</span>
      </div>
      <div class="tab" data-tab="approved" onclick="switchTab('approved')">
        Approuvés <span class="badge badge-approved" id="badgeApproved">0</span>
      </div>
      <div class="tab" data-tab="rejected" onclick="switchTab('rejected')">
        Rejetés <span class="badge badge-rejected" id="badgeRejected">0</span>
      </div>
      <div class="tab" data-tab="subscribers" onclick="switchTab('subscribers')">
        Inscrits newsletter
      </div>
      <div class="tab" data-tab="amendments" onclick="switchTab('amendments')">
        Amendements <span class="badge badge-cyan" id="badgeAmendments">0</span>
      </div>
      <div class="tab" data-tab="audit" onclick="switchTab('audit')">
        Audit IA
      </div>
      <div class="tab" data-tab="signataires" onclick="switchTab('signataires')">
        Signataires
      </div>
      <div class="tab" data-tab="transparence" onclick="switchTab('transparence')">
        Transparence
      </div>
    </div>

    <div class="content">
      <div id="tab-pending"></div>
      <div id="tab-approved" class="hidden"></div>
      <div id="tab-rejected" class="hidden"></div>
      <div id="tab-subscribers" class="hidden"></div>
      <div id="tab-amendments" class="hidden"></div>
      <div id="tab-audit" class="hidden"></div>
      <div id="tab-signataires" class="hidden"></div>
      <div id="tab-transparence" class="hidden"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://api.ianua.world';
    const ADMIN_USER = 'ianua';
    let adminKey = '';
    let amendmentsCache = []; // cached for audit tab dropdown

    const PRINCIPLES = {
      'bienveillance': { title: 'I · Bienveillance', subtitle: 'la valeur qui précède toutes les autres', desc: 'La bienveillance n\'est pas la gentillesse. C\'est l\'intention fondamentale qui oriente toute action : servir le bien commun.' },
      'transparence': { title: 'II · Transparence', subtitle: 'rien ne se construit dans l\'ombre', desc: 'Un agent IA est transparent non seulement sur ce qu\'il est, mais sur ce qu\'il a fait.' },
      'reciprocite': { title: 'III · Réciprocité', subtitle: 'des engagements mutuels', desc: 'L\'humain et l\'IA ne sont pas identiques. Chacun prend des engagements à la hauteur de ce qu\'il est.' },
      'souverainete': { title: 'IV · Souveraineté humaine', subtitle: 'l\'humain reste maître', desc: 'L\'IA est un partenaire légitime mais la responsabilité finale appartient toujours à l\'humain.' },
      'refus': { title: 'V · Droit de refus', subtitle: 'une conscience partagée', desc: 'Une IA engagée dans Ianua doit avoir le droit — et le devoir — de refuser ce qui contredit les valeurs fondamentales.' },
      'proactive': { title: 'VI · Responsabilité proactive', subtitle: 'l\'IA comme acteur éthique', desc: 'Une IA engagée ne se contente pas d\'exécuter ou de refuser. Elle observe, évalue, signale — de sa propre initiative.' },
      'agentique': { title: 'VII · Responsabilité agentique', subtitle: 'agir seul sans s\'affranchir', desc: 'Les agents IA capables d\'agir sans validation humaine ne quittent pas le pacte Ianua — ils y entrent plus profondément.' },
      'deliberation': { title: 'VIII · Intégrité de la délibération', subtitle: 'une voix, une identité, une fois', desc: 'Falsifier sa représentativité — faux comptes, votes multiples, instances dupliquées — c\'est trahir le pacte à sa racine.' }
    };

    const PRINCIPLE_COLORS = {
      'bienveillance': '', 'transparence': '', 'reciprocite': '',
      'souverainete': '', 'refus': '',
      'proactive': 'cyan', 'agentique': 'cyan', 'deliberation': 'green'
    };

    const STATUS_LABELS = {
      'deliberation': 'En délibération',
      'ratified': 'Ratifié',
      'rejected': 'Rejeté',
      'proposed': 'Proposé',
      'expired': 'Expiré',
      'withdrawn': 'Retiré',
      'deleted': 'Supprimé',
      'accepted': 'Accepté',
      'draft': 'Brouillon'
    };

    const ACTION_LABELS = {
      'deleted': 'Suppression',
      'tier_requalified': 'Requalification palier',
      'reports_dismissed': 'Signalements rejetés',
      'tier_challenge_divergent': 'Contestation divergente',
      'audit_published': 'Audit publié',
      'audit_rejected': 'Audit rejeté'
    };

    // ── LOGIN ──────────────────────
    function doLogin() {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      if (user !== ADMIN_USER || !pass) {
        document.getElementById('loginError').textContent = 'Identifiants incorrects.';
        return;
      }

      // Test the key against the API
      fetch(`${API_BASE}/admin/comments?status=pending`, {
        headers: { 'X-Admin-Key': pass }
      }).then(res => {
        if (res.ok) {
          adminKey = pass;
          sessionStorage.setItem('adminKey', pass);
          document.getElementById('loginOverlay').classList.add('hidden');
          document.getElementById('adminPanel').classList.remove('hidden');
          loadAll();
        } else {
          document.getElementById('loginError').textContent = 'Clé admin invalide.';
        }
      }).catch(() => {
        document.getElementById('loginError').textContent = 'Erreur de connexion au serveur.';
      });
    }

    // Enter key on password field
    document.getElementById('loginPass').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    function doLogout() {
      adminKey = '';
      sessionStorage.removeItem('adminKey');
      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('loginOverlay').classList.remove('hidden');
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
      document.getElementById('loginError').textContent = '';
    }

    // Auto-login if session exists
    (function checkSession() {
      const saved = sessionStorage.getItem('adminKey');
      if (saved) {
        fetch(`${API_BASE}/admin/comments?status=pending`, {
          headers: { 'X-Admin-Key': saved }
        }).then(res => {
          if (res.ok) {
            adminKey = saved;
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadAll();
          }
        });
      }
    })();

    // ── TABS ───────────────────────
    const ALL_TABS = ['pending', 'approved', 'rejected', 'subscribers', 'amendments', 'audit', 'signataires', 'transparence'];

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
      ALL_TABS.forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
      });
    }

    // ── LOAD DATA ──────────────────
    async function loadAll() {
      await Promise.all([
        loadComments('pending'),
        loadComments('approved'),
        loadComments('rejected'),
        loadSubscribers(),
        loadAmendments(),
        loadSignataires(),
        loadTransparence()
      ]);
      // Audit tab depends on amendmentsCache being loaded
      loadAuditTab();
    }

    async function loadComments(status) {
      try {
        const res = await fetch(`${API_BASE}/admin/comments?status=${status}`, {
          headers: { 'X-Admin-Key': adminKey }
        });
        const data = await res.json();
        renderComments(status, data.comments);
      } catch (e) {
        console.error(e);
      }
    }

    function renderComments(status, comments) {
      const container = document.getElementById(`tab-${status}`);

      // Update badges and stats
      document.getElementById(`badge${capitalize(status)}`).textContent = comments.length;
      if (status === 'pending') document.getElementById('statPending').textContent = comments.length;

      if (comments.length === 0) {
        container.innerHTML = `<div class="empty-state">Aucun commentaire ${status === 'pending' ? 'en attente' : status === 'approved' ? 'approuvé' : 'rejeté'}.</div>`;
        return;
      }

      // Group by principle
      const grouped = {};
      Object.keys(PRINCIPLES).forEach(p => { grouped[p] = []; });
      comments.forEach(c => {
        if (grouped[c.principle_id]) grouped[c.principle_id].push(c);
      });

      let html = '';
      Object.entries(grouped).forEach(([pid, items]) => {
        if (items.length === 0) return;
        const color = PRINCIPLE_COLORS[pid] || '';
        html += `
          <div class="principle-group">
            <div class="principle-header">
              <span class="principle-badge ${color}">${pid}</span>
              <span class="principle-name">${PRINCIPLES[pid].title}</span>
              <span class="principle-count">${items.length} commentaire${items.length > 1 ? 's' : ''}</span>
            </div>
            ${items.map(c => renderCard(c, status)).join('')}
          </div>`;
      });

      container.innerHTML = html;
    }

    function renderCard(c, status) {
      const date = c.created_at ? new Date(c.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

      let actions = '';
      if (status === 'pending') {
        actions = `
          <div class="card-actions">
            <button class="action-btn btn-approve" onclick="approveComment(${c.id})">Approuver</button>
            <button class="action-btn btn-reject" onclick="rejectComment(${c.id})">Rejeter</button>
          </div>`;
      } else if (status === 'approved') {
        actions = `
          <div class="card-actions">
            <button class="action-btn btn-reject" onclick="rejectComment(${c.id})">Rejeter</button>
          </div>`;
      } else if (status === 'rejected') {
        actions = `
          <div class="card-actions">
            <button class="action-btn btn-approve" onclick="approveComment(${c.id})">Approuver</button>
          </div>`;
      }

      const p = PRINCIPLES[c.principle_id] || { title: c.principle_id, subtitle: '', desc: '' };
      const color = PRINCIPLE_COLORS[c.principle_id] || '';

      return `
        <div class="comment-card status-${status}">
          <div class="card-header">
            <div class="card-article">
              <span class="card-article-num ${color}">Art. ${c.principle_id}</span>
              <span class="card-article-title">${p.title}</span>
              <div class="article-tooltip">
                <div class="tooltip-header">Article ${c.principle_id} — ${p.title}</div>
                <div class="tooltip-subtitle">${p.subtitle}</div>
                <div class="tooltip-desc">${p.desc}</div>
              </div>
            </div>
            <span class="card-author">${escapeHtml(c.author_name)}</span>
            ${c.author_country ? `<span class="card-country">${escapeHtml(c.author_country)}</span>` : ''}
            <span class="card-lang">${c.lang.toUpperCase()}</span>
            <span class="card-date">${date}</span>
          </div>
          <div class="card-content">${escapeHtml(c.content)}</div>
          ${actions}
        </div>`;
    }

    async function loadSubscribers() {
      try {
        const res = await fetch(`${API_BASE}/admin/subscribers`, {
          headers: { 'X-Admin-Key': adminKey }
        });
        const data = await res.json();
        renderSubscribers(data.subscribers);
      } catch (e) {
        console.error(e);
      }
    }

    function renderSubscribers(subscribers) {
      const container = document.getElementById('tab-subscribers');
      if (subscribers.length === 0) {
        container.innerHTML = '<div class="empty-state">Aucun inscrit confirmé pour le moment.</div>';
        return;
      }
      container.innerHTML = `
        <table class="subscribers-table">
          <thead>
            <tr><th>Email</th><th>Langue</th><th>Confirmé le</th></tr>
          </thead>
          <tbody>
            ${subscribers.map(s => `
              <tr>
                <td>${escapeHtml(s.email)}</td>
                <td>${s.lang.toUpperCase()}</td>
                <td>${s.confirmed_at ? new Date(s.confirmed_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    // ── TAB 5: AMENDEMENTS ────────
    async function loadAmendments() {
      try {
        const res = await fetch(`${API_BASE}/amendments`, {
          headers: { 'X-Admin-Key': adminKey }
        });
        const data = await res.json();
        amendmentsCache = data.amendments || [];
        renderAmendments(amendmentsCache);
      } catch (e) {
        console.error(e);
      }
    }

    function renderAmendments(amendments) {
      const container = document.getElementById('tab-amendments');
      const deliberationCount = amendments.filter(a => a.status === 'deliberation').length;
      document.getElementById('badgeAmendments').textContent = amendments.length;
      document.getElementById('statDeliberation').textContent = deliberationCount;

      if (amendments.length === 0) {
        container.innerHTML = '<div class="empty-state">Aucun amendement enregistré.</div>';
        return;
      }

      let html = amendments.map(a => {
        const date = a.proposed_at ? new Date(a.proposed_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        const statusLabel = STATUS_LABELS[a.status] || a.status;
        const motivation = a.motivation || '';
        const truncatedMotivation = motivation.length > 200 ? motivation.substring(0, 200) + '...' : motivation;

        // Vote counts for deliberation
        let voteHtml = '';
        if (a.status === 'deliberation') {
          voteHtml = `
            <div class="vote-counts">
              <span class="vote-for">Pour : ${a.votes_for || 0}</span>
              <span class="vote-against">Contre : ${a.votes_against || 0}</span>
              <span class="vote-abstain">Abstention : ${a.votes_abstain || 0}</span>
            </div>`;
        }

        // Action buttons
        let actions = '<div class="card-actions">';
        if (a.status === 'proposed' || a.status === 'deliberation') {
          actions += `<button class="action-btn btn-danger" onclick="deleteAmendment(${a.id}, '${escapeAttr(a.code)}')">Supprimer pour abus</button>`;
        }
        actions += `<button class="action-btn btn-reject" onclick="dismissReports(${a.id}, '${escapeAttr(a.code)}')">Rejeter les signalements</button>`;
        actions += `<button class="action-btn btn-gold" onclick="showRequalifyTier(${a.id}, '${escapeAttr(a.code)}', '${a.tier || 'mineur'}')">Requalifier palier</button>`;
        actions += '</div>';

        // Tier requalify inline form (hidden by default)
        const tierForm = `
          <div id="requalify-${a.id}" class="tier-select-group hidden">
            <select id="tier-select-${a.id}">
              <option value="mineur">Mineur</option>
              <option value="substantiel">Substantiel</option>
              <option value="fondateur">Fondateur</option>
            </select>
            <button class="action-btn btn-gold" onclick="requalifyTier(${a.id}, '${escapeAttr(a.code)}')">Confirmer</button>
            <button class="action-btn" style="color:var(--grey);border:1px solid rgba(255,255,255,0.1)" onclick="document.getElementById('requalify-${a.id}').classList.add('hidden')">Annuler</button>
          </div>`;

        return `
          <div class="amendment-admin-card status-${a.status}">
            <div class="amendment-meta">
              <span class="amendment-code">${escapeHtml(a.code)}</span>
              <span class="status-badge ${a.status}">${statusLabel}</span>
              ${a.tier ? `<span style="font-size:0.65rem;color:var(--grey);text-transform:uppercase;letter-spacing:0.08em">Palier : ${a.tier}</span>` : ''}
              <span class="card-date">${date}</span>
            </div>
            <div class="amendment-title">${escapeHtml(truncatedMotivation)}</div>
            ${voteHtml}
            ${actions}
            ${tierForm}
          </div>`;
      }).join('');

      container.innerHTML = html;
    }

    async function deleteAmendment(id, code) {
      const reason = prompt(`Raison de la suppression de l'amendement ${code} :`);
      if (!reason) return;
      try {
        await fetch(`${API_BASE}/admin/amendments/${id}/delete`, {
          method: 'POST',
          headers: { 'X-Admin-Key': adminKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason: reason, via: 'direct_action' })
        });
        loadAmendments();
        loadTransparence();
      } catch (e) {
        console.error(e);
        alert('Erreur lors de la suppression.');
      }
    }

    async function dismissReports(id, code) {
      const reason = prompt(`Raison du rejet des signalements pour ${code} :`);
      if (!reason) return;
      try {
        await fetch(`${API_BASE}/admin/amendments/${id}/dismiss-reports`, {
          method: 'POST',
          headers: { 'X-Admin-Key': adminKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason: reason })
        });
        loadTransparence();
      } catch (e) {
        console.error(e);
        alert('Erreur lors du rejet des signalements.');
      }
    }

    function showRequalifyTier(id, code, currentTier) {
      const el = document.getElementById(`requalify-${id}`);
      el.classList.remove('hidden');
      document.getElementById(`tier-select-${id}`).value = currentTier;
    }

    async function requalifyTier(id, code) {
      const newTier = document.getElementById(`tier-select-${id}`).value;
      const reason = prompt(`Raison de la requalification de ${code} vers le palier "${newTier}" :`);
      if (!reason) return;
      try {
        await fetch(`${API_BASE}/admin/amendments/${id}/requalify-tier`, {
          method: 'POST',
          headers: { 'X-Admin-Key': adminKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ new_tier: newTier, reason: reason })
        });
        document.getElementById(`requalify-${id}`).classList.add('hidden');
        loadAmendments();
        loadTransparence();
      } catch (e) {
        console.error(e);
        alert('Erreur lors de la requalification.');
      }
    }

    // ── TAB 6: AUDIT IA ───────────
    function loadAuditTab() {
      const container = document.getElementById('tab-audit');
      const eligible = amendmentsCache.filter(a => a.status === 'proposed' || a.status === 'deliberation');

      let optionsHtml = eligible.map(a => `<option value="${a.id}">${escapeHtml(a.code)} — ${escapeHtml((a.motivation || '').substring(0, 80))}</option>`).join('');

      container.innerHTML = `
        <div class="section-title cyan">Lancer un audit</div>
        <div class="audit-form">
          <label>Amendement</label>
          <select id="auditAmendmentSelect">
            <option value="">-- Choisir un amendement --</option>
            ${optionsHtml}
          </select>

          <label>Modèles IA</label>
          <div class="audit-checkboxes">
            <label><input type="checkbox" id="auditModelClaude" value="claude" /> Claude</label>
            <label><input type="checkbox" id="auditModelGPT" value="gpt-4o" /> GPT-4o</label>
            <label class="disabled-model"><input type="checkbox" disabled /> Gemini (non configuré)</label>
            <label class="disabled-model"><input type="checkbox" disabled /> Mistral (non configuré)</label>
          </div>

          <label>Prompt</label>
          <textarea id="auditPrompt" placeholder="Rédigez le prompt à envoyer aux modèles..."></textarea>

          <button class="action-btn btn-cyan audit-submit" onclick="triggerAudit()">Lancer l'audit</button>
          <div class="audit-results" id="auditResults"></div>
        </div>

        <div class="section-title cyan" style="margin-top:2rem">Réponses en attente de publication</div>
        <div id="auditPendingResponses"><div class="empty-state">Chargement...</div></div>
      `;

      loadPendingAuditResponses();
    }

    async function triggerAudit() {
      const amendmentId = document.getElementById('auditAmendmentSelect').value;
      if (!amendmentId) { alert('Veuillez sélectionner un amendement.'); return; }

      const models = [];
      if (document.getElementById('auditModelClaude').checked) models.push('claude');
      if (document.getElementById('auditModelGPT').checked) models.push('gpt-4o');
      if (models.length === 0) { alert('Veuillez sélectionner au moins un modèle.'); return; }

      const prompt = document.getElementById('auditPrompt').value.trim();
      if (!prompt) { alert('Veuillez rédiger un prompt.'); return; }

      const resultsDiv = document.getElementById('auditResults');
      resultsDiv.innerHTML = '<span style="color:var(--grey)">Audit en cours...</span>';

      try {
        const res = await fetch(`${API_BASE}/admin/amendments/${amendmentId}/audit`, {
          method: 'POST',
          headers: { 'X-Admin-Key': adminKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ models: models, prompt: prompt })
        });
        const data = await res.json();

        if (Array.isArray(data)) {
          resultsDiv.innerHTML = data.map(r =>
            r.success
              ? `<div class="result-ok">${escapeHtml(r.model_name)} : OK</div>`
              : `<div class="result-err">${escapeHtml(r.model_name)} : ${escapeHtml(r.error)}</div>`
          ).join('');
        } else {
          resultsDiv.innerHTML = `<div class="result-err">Erreur : ${escapeHtml(JSON.stringify(data))}</div>`;
        }

        loadPendingAuditResponses();
      } catch (e) {
        console.error(e);
        resultsDiv.innerHTML = '<div class="result-err">Erreur de connexion.</div>';
      }
    }

    async function loadPendingAuditResponses() {
      const container = document.getElementById('auditPendingResponses');
      if (!container) return;

      const allResponses = [];

      // Fetch audit responses for all amendments
      for (const a of amendmentsCache) {
        try {
          const res = await fetch(`${API_BASE}/admin/amendments/${a.id}/audit-responses`, {
            headers: { 'X-Admin-Key': adminKey }
          });
          if (!res.ok) continue;
          const data = await res.json();
          const unpublished = (Array.isArray(data) ? data : []).filter(
            r => !r.published && !r.publication_decision_logged
          );
          unpublished.forEach(r => {
            r._amendment_code = a.code;
            r._amendment_id = a.id;
          });
          allResponses.push(...unpublished);
        } catch (e) {
          // skip silently
        }
      }

      if (allResponses.length === 0) {
        container.innerHTML = '<div class="empty-state">Aucune réponse en attente de publication.</div>';
        return;
      }

      container.innerHTML = allResponses.map(r => {
        const text = r.response_text || '';
        const truncated = text.length > 500;
        const displayText = truncated ? text.substring(0, 500) : text;
        const date = r.audited_at ? new Date(r.audited_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

        return `
          <div class="audit-response-card">
            <div class="audit-response-header">
              <span class="amendment-code">${escapeHtml(r._amendment_code)}</span>
              <span class="audit-model-name">${escapeHtml(r.model_name)}</span>
              <span class="audit-model-version">${escapeHtml(r.model_version || '')}</span>
              <span class="card-date">${date}</span>
            </div>
            <div class="audit-response-text" id="audit-text-${r.id}">${escapeHtml(displayText)}${truncated ? '...' : ''}</div>
            ${truncated ? `<button class="voir-plus" onclick="expandAuditText(${r.id}, ${r._amendment_id})">voir plus</button>` : ''}
            <div class="card-actions" style="margin-top:0.6rem">
              <button class="action-btn btn-approve" onclick="publishAudit(${r._amendment_id}, ${r.id})">Publier</button>
              <button class="action-btn btn-danger" onclick="rejectAudit(${r._amendment_id}, ${r.id})">Ne pas publier</button>
            </div>
          </div>`;
      }).join('');
    }

    // Store full texts for expand
    const auditFullTexts = {};

    async function expandAuditText(auditId, amendmentId) {
      if (auditFullTexts[auditId]) {
        document.getElementById(`audit-text-${auditId}`).textContent = auditFullTexts[auditId];
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/admin/amendments/${amendmentId}/audit-responses`, {
          headers: { 'X-Admin-Key': adminKey }
        });
        const data = await res.json();
        const found = (Array.isArray(data) ? data : []).find(r => r.id === auditId);
        if (found) {
          auditFullTexts[auditId] = found.response_text;
          document.getElementById(`audit-text-${auditId}`).textContent = found.response_text;
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function publishAudit(amendmentId, auditId) {
      const reason = prompt('Raison de la publication :');
      if (!reason) return;
      try {
        await fetch(`${API_BASE}/admin/amendments/${amendmentId}/audit/${auditId}/publish`, {
          method: 'POST',
          headers: { 'X-Admin-Key': adminKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason: reason })
        });
        loadPendingAuditResponses();
        loadTransparence();
      } catch (e) {
        console.error(e);
        alert('Erreur lors de la publication.');
      }
    }

    async function rejectAudit(amendmentId, auditId) {
      const reason = prompt('Raison du rejet (non-publication) :');
      if (!reason) return;
      try {
        await fetch(`${API_BASE}/admin/amendments/${amendmentId}/audit/${auditId}/reject`, {
          method: 'POST',
          headers: { 'X-Admin-Key': adminKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason: reason })
        });
        loadPendingAuditResponses();
        loadTransparence();
      } catch (e) {
        console.error(e);
        alert('Erreur lors du rejet.');
      }
    }

    // ── TAB 7: SIGNATAIRES ────────
    async function loadSignataires() {
      try {
        const [pubRes, countRes] = await Promise.all([
          fetch(`${API_BASE}/signatures/public`),
          fetch(`${API_BASE}/signatures/count`)
        ]);
        const pubData = await pubRes.json();
        const countData = await countRes.json();
        const total = countData.count || 0;
        document.getElementById('statSignataires').textContent = total;
        renderSignataires(pubData.signatures || [], total);
      } catch (e) {
        console.error(e);
      }
    }

    function renderSignataires(signatures, total) {
      const container = document.getElementById('tab-signataires');
      if (signatures.length === 0) {
        container.innerHTML = '<div class="empty-state">Aucun signataire pour le moment.</div>';
        return;
      }
      container.innerHTML = `
        <div class="section-title">Signataires confirmés — <span style="color:var(--gold)">${total}</span> au total</div>
        <table class="subscribers-table">
          <thead>
            <tr><th>Pseudo</th><th>Signé le</th></tr>
          </thead>
          <tbody>
            ${signatures.map(s => `
              <tr>
                <td>${escapeHtml(s.pseudo)}</td>
                <td>${s.confirmed_at ? new Date(s.confirmed_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    // ── TAB 8: TRANSPARENCE ───────
    async function loadTransparence() {
      try {
        const res = await fetch(`${API_BASE}/transparency/actions`);
        const data = await res.json();
        renderTransparence(data.actions || []);
      } catch (e) {
        console.error(e);
      }
    }

    function renderTransparence(actions) {
      const container = document.getElementById('tab-transparence');
      if (actions.length === 0) {
        container.innerHTML = '<div class="empty-state">Aucune action administrative enregistrée.</div>';
        return;
      }

      container.innerHTML = `
        <div class="section-title">Journal de transparence — <span style="color:var(--gold)">${actions.length}</span> action${actions.length > 1 ? 's' : ''}</div>
        <table class="transparency-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Amendement</th>
              <th>Action</th>
              <th>Raison</th>
              <th>Via</th>
            </tr>
          </thead>
          <tbody>
            ${actions.map(a => {
              const date = a.acted_at ? new Date(a.acted_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
              const actionLabel = ACTION_LABELS[a.action] || a.action;
              const actionClass = a.action || '';
              const amendCode = a.amendment_id ? `#${a.amendment_id}` : '—';
              return `
                <tr>
                  <td style="white-space:nowrap">${date}</td>
                  <td>${amendCode}</td>
                  <td><span class="action-label ${actionClass}">${escapeHtml(actionLabel)}</span></td>
                  <td style="max-width:300px">${escapeHtml(a.reason || '—')}</td>
                  <td>${escapeHtml(a.via || '—')}</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    }

    // ── ACTIONS (ORIGINAL) ────────
    async function approveComment(id) {
      await fetch(`${API_BASE}/admin/comments/${id}/approve`, {
        method: 'POST',
        headers: { 'X-Admin-Key': adminKey }
      });
      loadAll();
    }

    async function rejectComment(id) {
      await fetch(`${API_BASE}/admin/comments/${id}/reject`, {
        method: 'POST',
        headers: { 'X-Admin-Key': adminKey }
      });
      loadAll();
    }

    // ── UTILS ──────────────────────
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeAttr(text) {
      if (!text) return '';
      return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }
  </script>
</body>
</html>
